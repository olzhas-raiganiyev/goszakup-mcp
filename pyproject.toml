[project]
name = "goszakup-mcp"
version = "0.1.0.dev0"
description = "MCP server for Kazakhstan public procurement data (goszakup.gov.kz), with an open tool-use eval"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Olzhas Raiganiyev", email = "olzhas.raiganiyev04@gmail.com" }]
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "kazakhstan", "procurement", "goszakup", "llm"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2.11,<3",
]

[project.urls]
Homepage = "https://github.com/olzhas-raiganiyev/goszakup-mcp"
Issues = "https://github.com/olzhas-raiganiyev/goszakup-mcp/issues"

[project.scripts]
goszakup-mcp = "goszakup_mcp.__main__:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["goszakup_mcp"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "ASYNC"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
